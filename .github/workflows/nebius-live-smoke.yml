name: Nebius live smoke test

on:
  push:
    branches:
      - hackathon/nebius-personal-ai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NEBIUS_MODEL: nvidia/nvidia-nemotron-3-nano-30b-a3b
      NEBIUS_URL: https://api.tokenfactory.nebius.com/v1/chat/completions
    steps:
      - name: Detect Nebius credential
        id: credential
        shell: bash
        run: |
          if [ -z "${NEBIUS_API_KEY:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NEBIUS_API_KEY is not configured; live steps will be skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify live Nemotron inference
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             --request POST "$NEBIUS_URL"             --header "Authorization: Bearer $NEBIUS_API_KEY"             --header "Content-Type: application/json"             --data "$(jq -n               --arg model "$NEBIUS_MODEL"               '{
                model: $model,
                messages: [
                  {role: "user", content: "Reply with exactly LIVE_NEMOTRON_OK"}
                ],
                max_tokens: 32,
                temperature: 0
              }')")"
          echo "$response" | jq -e '.choices[0].message.content'
          echo "$response" | jq -e '.choices[0].message.content | contains("LIVE_NEMOTRON_OK")'

      - name: Verify forced tool calling
        if: steps.credential.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             --request POST "$NEBIUS_URL"             --header "Authorization: Bearer $NEBIUS_API_KEY"             --header "Content-Type: application/json"             --data "$(jq -n               --arg model "$NEBIUS_MODEL"               '{
                model: $model,
                messages: [
                  {role: "user", content: "Use the remember tool with key preferred_language and value Arabic."}
                ],
                tools: [
                  {
                    type: "function",
                    function: {
                      name: "remember",
                      description: "Persist a bounded private user fact locally.",
                      parameters: {
                        type: "object",
                        properties: {
                          key: {type: "string"},
                          value: {type: "string"}
                        },
                        required: ["key", "value"]
                      }
                    }
                  }
                ],
                tool_choice: {
                  type: "function",
                  function: {name: "remember"}
                },
                max_tokens: 128,
                temperature: 0
              }')")"
          echo "$response" | jq -e '.choices[0].message.tool_calls[0].function.name == "remember"'
          echo "$response" | jq -e '.choices[0].message.tool_calls[0].function.arguments'
